<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Wildfire Digital Twin — Los Angeles. NASA and interagency fire, smoke, vegetation and weather layers on one map."
    />
    <title>WFDT · Wildfire Digital Twin — Los Angeles</title>
  </head>
  <body>
    <div id="map" aria-label="Wildfire map"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🔥</span>
        <span class="brand-name">WFDT</span>
      </div>
      <div class="topbar-readout" id="readout" aria-live="polite"></div>
      <nav class="topbar-actions">
        <button class="tb" id="btn-layers" aria-label="Layers" title="Layers (L)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm0 8.7L4.6 8 12 4.3 19.4 8 12 11.7ZM2 12l10 5 10-5M2 16l10 5 10-5"/></svg>
          <span>Layers</span>
        </button>
        <button class="tb" id="btn-chat" aria-label="Ask AI" title="Ask the wildfire assistant (A)">
          <!-- Robot, on the same 24x24 grid and stroke weight as the Layers icon. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="3.6" r="1.6" />
            <path d="M12 5.2V8" />
            <rect x="3" y="8" width="18" height="12" rx="2.5" />
            <path d="M8.5 14h.01M15.5 14h.01" />
            <path d="M2 13v2M22 13v2" />
          </svg>
          <span>Ask AI</span>
        </button>
      </nav>
    </header>

    <aside class="panel panel-layers" id="panel-layers" aria-label="Map layers" hidden>
      <div class="panel-grip" aria-hidden="true"></div>
      <div class="panel-head">
        <h2>Layers</h2>
        <button class="panel-close" data-close="panel-layers" aria-label="Close layers">✕</button>
      </div>
      <div class="panel-body" id="layer-list"></div>
    </aside>

    <aside class="panel panel-chat" id="panel-chat" aria-label="Wildfire assistant" hidden>
      <div class="panel-grip" aria-hidden="true"></div>
      <div class="panel-head">
        <h2>Wildfire Assistant</h2>
        <button class="panel-close" data-close="panel-chat" aria-label="Close assistant">✕</button>
      </div>
      <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
      <form class="chat-input" id="chat-form">
        <label class="sr-only" for="chat-text">Message the wildfire assistant</label>
        <textarea
          id="chat-text"
          rows="1"
          placeholder="Ask about fires, smoke, winds, or vegetation…"
          autocomplete="off"
        ></textarea>
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </aside>

    <div class="legend" id="legend" hidden></div>

    <footer class="timebar">
      <button class="tb-play" id="btn-play" aria-label="Play time animation">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
      </button>
      <input type="range" id="time-slider" aria-label="Date" />
      <div class="time-label" id="time-label"></div>
      <div class="live" id="live"></div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
